<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: pagina('Confirmar Eliminación', 'equipos', ~{::contenido})}">
<body>

    <section th:fragment="contenido">
        <div class="contenedor-confirmacion-centrado">

            <div class="caja-confirmacion">
                <h2 class="pregunta-confirmacion">¿Está seguro de eliminar este equipo?</h2>

                <div class="acciones-confirmacion">
                    <!-- Botón SÍ: Procesa la eliminación mediante POST -->
                    <form th:action="@{/admin/equipos/{id}/eliminar(id=${equipo.id})}" method="post">
                        <button type="submit" class="btn-confirmar-si">SI</button>
                    </form>

                    <!-- Botón NO: Cancela y vuelve al menú del equipo -->
                    <a th:href="@{/equipos/{id}(id=${equipo.id})}" class="btn-confirmar-no">NO</a>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
