<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: pagina('Error', 'dashboard', ~{::contenido})}">
<body>

<section th:fragment="contenido">
    <div class="contenedor-confirmacion-centrado">
        <div class="caja-confirmacion">
            <h2 class="pregunta-confirmacion">Ha ocurrido un error</h2>
            <p th:if="${status != null}" th:text="'Código: ' + ${status}">Código: 500</p>
            <p th:if="${path != null}" th:text="'Ruta: ' + ${path}">Ruta: /</p>
            <div class="acciones-confirmacion">
                <a th:href="@{/}" class="btn-confirmar-no">VOLVER AL INICIO</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
