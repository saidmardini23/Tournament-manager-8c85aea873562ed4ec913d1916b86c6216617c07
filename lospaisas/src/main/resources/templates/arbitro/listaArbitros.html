<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: pagina('Lista de Árbitros', 'arbitros', ~{::contenido})}">
<body>

    <section th:fragment="contenido">
        <div class="contenedor-torneos-centrado">

            <div class="encabezado-seccion">
                <a th:href="@{/admin}" class="btn-volver">&lt; Volver</a>
                <h1 class="titulo-formulario">ÁRBITROS</h1>
                <a th:href="@{/admin/arbitros/nuevo}" class="btn-acceso btn-destacado">+ Crear Árbitro</a>
            </div>

            <form th:action="@{/arbitros}" method="get" class="form-buscador-equipo">
                <div class="campo-busqueda">
                    <input type="text" name="buscar" th:value="${buscar}" placeholder="Buscar por nombre o apellido..." class="input-busqueda" />
                    <button type="submit" class="btn-buscar">Buscar</button>
                </div>
            </form>

            <div class="lista-torneos-columna">
                <div th:each="a : ${arbitros}" class="item-torneo-columna">
                    <a th:href="@{/arbitros/{id}(id=${a.id})}" class="enlace-menu-torneo">
                        <span class="nombre-torneo" th:text="${a.nombre} + ' ' + ${a.apellido}">Nombre</span>
                        <span class="estado-torneo" th:text="${a.licencia != null && !a.licencia.isEmpty()} ? ${a.licencia} : 'SIN LICENCIA'">LICENCIA</span>
                    </a>
                </div>
                <div th:if="${#lists.isEmpty(arbitros)}" class="tabla-vacia">No hay árbitros registrados.</div>
            </div>

        </div>
    </section>

</body>
</html>
