<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina('Lista de Partidos', ~{::contenido})}">
<body>

<section th:fragment="contenido">
    <div class="contenedor-torneos-centrado">
        
        <div class="encabezado-seccion">
            <a th:if="${jornadaId != null}" th:href="@{/jornadas/{id}(id=${jornadaId})}" class="btn-volver">&lt; Volver a la Jornada</a>
            <a th:unless="${jornadaId != null}" th:href="@{/torneos}" class="btn-volver">&lt; Volver a Torneos</a>
            
            <h1 class="titulo-formulario" th:text="${jornada != null} ? ('PARTIDOS DE LA JORNADA ' + ${jornada.numeroJornada}) : 'LISTA DE PARTIDOS'">PARTIDOS</h1>

            <a th:if="${jornadaId != null}" th:href="@{/admin/partidos/nuevo(jornadaId=${jornadaId})}" class="btn-acceso btn-destacado">+ Programar Partido</a>
            <a th:unless="${jornadaId != null}" th:href="@{/admin/partidos/nuevo}" class="btn-acceso btn-destacado">+ Programar Partido</a>
        </div>

        <div th:replace="~{fragments/mensajes :: mensajes}"></div>

        <div class="seccion-tabla-posiciones">
            <div class="tabla-contenedor">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>FECHA Y HORA</th>
                            <th>LOCAL</th>
                            <th>MARCADOR / VS</th>
                            <th>VISITANTE</th>
                            <th>ESTADO</th>
                            <th>ÁRBITRO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${partidos}">
                            <td th:text="${p.fecha != null} ? ${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')} : 'Por definir'">01/01/2026 00:00</td>
                            <td class="resaltar-nombre" th:text="${p.equipoLocalNombre}">Local</td>
                            <td class="resaltar-estadistica">
                                <span th:if="${p.estado != null and (p.estado == 'FINALIZADO' or p.estado == 'EN_JUEGO')}"
                                      th:text="${p.golesLocal} + ' - ' + ${p.golesVisitante}">0 - 0</span>
                                <span th:unless="${p.estado != null and (p.estado == 'FINALIZADO' or p.estado == 'EN_JUEGO')}">VS</span>
                            </td>
                            <td class="resaltar-nombre" th:text="${p.equipoVisitanteNombre}">Visitante</td>
                            <td><span class="estado-torneo" th:text="${p.estado}">PROGRAMADO</span></td>
                            <td th:text="${p.arbitroNombre != null} ? ${p.arbitroNombre} : 'Sin asignar'">Árbitro</td>
                            <td>
                                <a th:href="@{/partidos/{id}(id=${p.id})}" class="enlace-accion">Ver Partido</a>
                                <a th:href="@{/admin/partidos/{id}/opciones(id=${p.id})}" class="btn-opciones">&#9881;</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(partidos)}">
                            <td colspan="7" class="tabla-vacia">No hay partidos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</section>

</body>
</html>
